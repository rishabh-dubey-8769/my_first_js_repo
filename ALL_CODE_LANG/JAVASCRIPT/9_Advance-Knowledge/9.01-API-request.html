<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API-Request</title>
</head>
<body>
    <h2>Hello, Dubey this side.</h2>
    <script>
        const requestUrl='https://api.github.com/users/rishabh-dubey-8769'
        const xhr=new XMLHttpRequest();
        xhr.open('GET',requestUrl);
        console.log("here i am.")
        console.log(xhr.readyState)
        xhr.onreadystatechange=function(){
            console.log(xhr.readyState)
            if(xhr.readyState===4){
                const data=JSON.parse(this.responseText)          //response text usually comes in form of string
                console.log(typeof data)
                console.log( data.followers)
            }
        }
        xhr.send();
    </script>
</body>
</html>
