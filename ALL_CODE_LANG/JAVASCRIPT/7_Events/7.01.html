   //=======================================DOM EVENT OBJECT PROPERTIES & METHODS WITH EXAMPLES ====================================

    /* --- 1. Basic Metadata --- */
    // type: Returns the name of the event (e.g., "click", "mouseover").
    // Example: document.addEventListener('click', (e) => console.log(e.type)); 

    // timeStamp: The time (in milliseconds) when the event occurred since the page loaded.
    // Example: let time = e.timeStamp;

    // defaultPrevented: A boolean indicating if preventDefault() was called.
    // Example: if (e.defaultPrevented) console.log("Default action canceled");


    /* --- 2. Element References (Targets) --- */
    // target: The actual element that triggered the event (the deepest child).
    // Example: e.target.style.backgroundColor = 'yellow';

    // currentTarget: The element the event listener is attached to.
    // Example: console.log("Event handled by: " + e.currentTarget.id);

    // srcElement: A non-standard legacy alias for 'target' (Old IE).
    // Example: let targetEl = e.target || e.srcElement;

    // toElement: The element the mouse moved TO (specific to mouseover/mouseout).
    // Example: console.log("Mouse moved to: ", e.toElement);


    /* --- 3. Coordinates & Positioning --- */
    // clientX / clientY: Coordinates relative to the browser's viewport.
    // Example: console.log(`Viewport: X=${e.clientX}, Y=${e.clientY}`);

    // screenX / screenY: Coordinates relative to the physical monitor screen.
    // Example: console.log(`Screen: X=${e.screenX}, Y=${e.screenY}`);


    /* --- 4. Keyboard & Modifier Keys --- */
